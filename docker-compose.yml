services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-binance_bot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bot} -d ${POSTGRES_DB:-binance_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - db-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          cpus: '0.1'
          memory: 64M

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-binance_bot}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Define ENCRYPTION_KEY en el archivo .env}
      MOCK_MODE: ${MOCK_MODE:-true}
      DRY_RUN: ${DRY_RUN:-true}
      USE_TESTNET: ${USE_TESTNET:-true}
      FUNDING_ENABLED: ${FUNDING_ENABLED:-false}
      FUNDING_POLL_SECONDS: ${FUNDING_POLL_SECONDS:-300}
      FUNDING_MIN_ANNUAL_PCT: ${FUNDING_MIN_ANNUAL_PCT:-8.0}
      FUNDING_NOTIONAL_USDT: ${FUNDING_NOTIONAL_USDT:-100}
      FUNDING_LEVERAGE: ${FUNDING_LEVERAGE:-1}
      FUNDING_EXIT_IF_NEGATIVE: ${FUNDING_EXIT_IF_NEGATIVE:-true}
      FUNDING_SYMBOLS: ${FUNDING_SYMBOLS:-BTCUSDT,ETHUSDT,SOLUSDT}
      FUNDING_HISTORY_BASE_URL: ${FUNDING_HISTORY_BASE_URL:-https://fapi.binance.com}
      FUNDING_MIN_INTERVALS: ${FUNDING_MIN_INTERVALS:-3}
      FUNDING_MAX_ZSCORE: ${FUNDING_MAX_ZSCORE:-2.5}
      FUNDING_MAX_BASIS_PCT: ${FUNDING_MAX_BASIS_PCT:-0.5}
      FUNDING_HISTORY_WINDOW: ${FUNDING_HISTORY_WINDOW:-30}
      FUNDING_EVENT_BLACKOUT_MINUTES: ${FUNDING_EVENT_BLACKOUT_MINUTES:-120}
      FUNDING_LIQUIDATION_PRESSURE_ENABLED: ${FUNDING_LIQUIDATION_PRESSURE_ENABLED:-true}
      FUNDING_MAX_LIQUIDATION_PRESSURE: ${FUNDING_MAX_LIQUIDATION_PRESSURE:-0.85}
      FUNDING_LIQUIDATION_TARGET_RATE: ${FUNDING_LIQUIDATION_TARGET_RATE:-0.00005}
      FUNDING_MIN_HOLD_DAYS: ${FUNDING_MIN_HOLD_DAYS:-7}
      FUNDING_MAKER_TIMEOUT_SECONDS: ${FUNDING_MAKER_TIMEOUT_SECONDS:-20}
      FUNDING_MAKER_FEE: ${FUNDING_MAKER_FEE:-0.0002}
      FUNDING_TAKER_FEE: ${FUNDING_TAKER_FEE:-0.0004}
      FUNDING_USE_MAKER: ${FUNDING_USE_MAKER:-true}
      FUNDING_MAKER_PRICE_OFFSET: ${FUNDING_MAKER_PRICE_OFFSET:-0.0001}
      FUNDING_MIN_FALLBACK_ANNUAL_PCT: ${FUNDING_MIN_FALLBACK_ANNUAL_PCT:-15.0}
      FUNDING_USE_PERSISTENCE: ${FUNDING_USE_PERSISTENCE:-true}
      FUNDING_MIN_PERSISTENCE_PROB: ${FUNDING_MIN_PERSISTENCE_PROB:-0.6}
      FUNDING_PERSISTENCE_MIN_SAMPLES: ${FUNDING_PERSISTENCE_MIN_SAMPLES:-20}
      FUNDING_PERSISTENCE_TARGET_RATE: ${FUNDING_PERSISTENCE_TARGET_RATE:-0.00005}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8000}
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:-}
      MODEL_INTEGRITY_HASH: ${MODEL_INTEGRITY_HASH:-}
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      SENTIMENT_ENABLED: ${SENTIMENT_ENABLED:-false}
      SENTIMENT_API_KEY: ${SENTIMENT_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend-network
      - db-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "backend.workers.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-binance_bot}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Define ENCRYPTION_KEY en el archivo .env}
      MOCK_MODE: ${MOCK_MODE:-true}
      USE_TESTNET: ${USE_TESTNET:-true}
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-network
      - db-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "backend.workers.celery_app", "beat", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-binance_bot}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Define ENCRYPTION_KEY en el archivo .env}
      MOCK_MODE: ${MOCK_MODE:-true}
      USE_TESTNET: ${USE_TESTNET:-true}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend-network
      - db-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:8080"
    networks:
      - backend-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

networks:
  db-network:
    driver: bridge
    internal: true
  backend-network:
    driver: bridge

volumes:
  pgdata:
  redis-data:
